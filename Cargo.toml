[package]
name = "image_editor"
version = "0.1.0"
edition = "2021"
# 真实最低版本：`theme.rs` 用了 `LazyLock`（1.80 稳定）；依赖侧 winit 0.30 要
# 1.70、wgpu 24 要 1.76、objc2 0.6 要 1.71（igui 自己声明 1.75）。
rust-version = "1.80"
publish = false

[[bin]]
name = "image_editor"
path = "src/main.rs"

[dependencies]
# The UI is built with the igui stack (formerly quill; see AGENTS.md):
# no `egui` here — `igui_ui` / `igui_components` / `igui_theme` replace it.
#
# Crates come from the upstream GitHub repo in *git dependency mode* rather than
# a sibling path checkout, pinned to the release tag documented in the repo's
# `release.md` (v0.3.0). All crates share one repo, so Cargo fetches it once.
igui_core = { git = "https://github.com/lazyfury/igui", tag = "v0.3.0" }
igui_render = { git = "https://github.com/lazyfury/igui", tag = "v0.3.0" }
igui_scene = { git = "https://github.com/lazyfury/igui", tag = "v0.3.0" }
igui_theme = { git = "https://github.com/lazyfury/igui", tag = "v0.3.0" }
igui_ui = { git = "https://github.com/lazyfury/igui", tag = "v0.3.0" }
igui_components = { git = "https://github.com/lazyfury/igui", tag = "v0.3.0" }
# Lucide 图标：核心的 backend-neutral SVG 渲染（零外部依赖）。
igui_svg = { git = "https://github.com/lazyfury/igui", tag = "v0.3.0" }
# 字体类型（`FontConfig` / `FaceRef` / ...）是后端无关的，直接依赖 `igui_font`，
# 不绕经某个具体后端（`igui_backend_wgpu` 里的同名导出只是历史别名）。
igui_font = { git = "https://github.com/lazyfury/igui", tag = "v0.3.0" }
# PNG 编解码（Phase 7 导入导出）。示例层可以引入依赖；核心 crate 仍保持无依赖。
png = "0.17"
igui_backend_wgpu = { git = "https://github.com/lazyfury/igui", tag = "v0.3.0" }
# `igui_app` plugin runtime + the `igui_winit` platform plugins
# (window / wgpu / input / IME / text measure / clipboard).
igui_app = { git = "https://github.com/lazyfury/igui", tag = "v0.3.0" }
igui_winit = { git = "https://github.com/lazyfury/igui", tag = "v0.3.0" }
# Headless self-check (`--selfcheck`): record draw lists + inspect them,
# so the UI can be verified without a window or a screenshot.
igui_backend_recording = { git = "https://github.com/lazyfury/igui", tag = "v0.3.0" }
igui_profile = { git = "https://github.com/lazyfury/igui", tag = "v0.3.0" }
# Structured events for the important app actions (AGENTS.md §31).
tracing = "0.1"
# 拖放：`igui_winit` 不转发拖放，宿主自己看 `winit::event::WindowEvent`
# （`DroppedFile`）。版本必须和 `igui_winit` 依赖的 winit 一致，否则类型对不上。
winit = "0.30"

# 原生文件对话框：手写平台 FFI，不引第三方对话框 crate。macOS 走 AppKit 的
# `NSOpenPanel` / `NSSavePanel`；`objc2*` 已在 winit/wgpu 的依赖树里。
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSApplication",
    "NSOpenPanel",
    "NSSavePanel",
    "NSPanel",
    "NSResponder",
    "NSWindow",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSString",
    "NSURL",
] }

# 发布构建（`package-macos.sh` 用）：LTO + 单 codegen unit 换更小 / 更快的 .app。
[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# 独立的桌面应用示例：不加入主 workspace，避免 winit/wgpu 影响
# `cargo check --workspace`（跟 `examples/file_browser` 同样的取舍）。
[workspace]
