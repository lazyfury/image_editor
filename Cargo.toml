[package]
name = "image_editor"
version = "0.1.0"
edition = "2021"
# `winit` / `wgpu` (pulled in by `igui_backend_wgpu`) need newer Rust than the
# workspace default, exactly like `examples/wgpu_demo`.
rust-version = "1.76"
publish = false

[[bin]]
name = "image_editor"
path = "src/main.rs"

[dependencies]
# The UI is built with the igui stack (formerly quill; see AGENTS.md):
# no `egui` here — `igui_ui` / `igui_components` / `igui_theme` replace it.
#
# Crates come from the upstream GitHub repo in *git dependency mode* rather than
# a sibling path checkout, pinned to the release tag documented in the repo's
# `release.md` (v0.2.0). All crates share one repo, so Cargo fetches it once.
igui_core = { git = "https://github.com/lazyfury/igui", tag = "v0.2.0" }
igui_render = { git = "https://github.com/lazyfury/igui", tag = "v0.2.0" }
igui_scene = { git = "https://github.com/lazyfury/igui", tag = "v0.2.0" }
igui_theme = { git = "https://github.com/lazyfury/igui", tag = "v0.2.0" }
igui_ui = { git = "https://github.com/lazyfury/igui", tag = "v0.2.0" }
igui_components = { git = "https://github.com/lazyfury/igui", tag = "v0.2.0" }
# Lucide 图标：核心的 backend-neutral SVG 渲染（零外部依赖）。
igui_svg = { git = "https://github.com/lazyfury/igui", tag = "v0.2.0" }
# 字体类型（`FontConfig` / `FaceRef` / ...）是后端无关的，直接依赖 `igui_font`，
# 不绕经某个具体后端（`igui_backend_wgpu` 里的同名导出只是历史别名）。
igui_font = { git = "https://github.com/lazyfury/igui", tag = "v0.2.0" }
# PNG 编解码（Phase 7 导入导出）。示例层可以引入依赖；核心 crate 仍保持无依赖。
png = "0.17"
igui_backend_wgpu = { git = "https://github.com/lazyfury/igui", tag = "v0.2.0" }
# Headless self-check (`--selfcheck`): record draw lists + inspect them,
# so the UI can be verified without a window or a screenshot.
igui_backend_recording = { git = "https://github.com/lazyfury/igui", tag = "v0.2.0" }
igui_profile = { git = "https://github.com/lazyfury/igui", tag = "v0.2.0" }
winit = "0.30"
# Structured events for the important app actions (AGENTS.md §31).
tracing = "0.1"

# 独立的桌面应用示例：不加入主 workspace，避免 winit/wgpu 影响
# `cargo check --workspace`（跟 `examples/file_browser` 同样的取舍）。
[workspace]
